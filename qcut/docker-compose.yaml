services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: qcut
      POSTGRES_PASSWORD: qcutthegoat
      POSTGRES_DB: qcut
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qcut"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

volumes:  
  postgres_data:

networks:  
  default:  
    name: qcut-network
