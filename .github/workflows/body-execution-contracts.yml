name: Body execution contracts

on:
  pull_request:
    branches: [master]
    paths:
      - qcut/research/independent-beauty/research/**
      - qcut/research/independent-beauty/probes/**
      - qcut/research/jianying-runtime-probe/body_backend_*
      - qcut/research/jianying-runtime-probe/test_body_backend_*
      - qcut/research/jianying-runtime-probe/body_timestamp_*
      - qcut/research/jianying-runtime-probe/test_body_timestamp_*
      - qcut/scripts/body-coreml-editor-report.py
      - qcut/scripts/test_body_coreml_editor_report.py
      - .github/workflows/body-execution-contracts.yml
  push:
    branches: [master]
    paths:
      - qcut/research/independent-beauty/research/**
      - qcut/research/independent-beauty/probes/**
      - qcut/research/jianying-runtime-probe/body_backend_*
      - qcut/research/jianying-runtime-probe/test_body_backend_*
      - qcut/research/jianying-runtime-probe/body_timestamp_*
      - qcut/research/jianying-runtime-probe/test_body_timestamp_*
      - qcut/scripts/body-coreml-editor-report.py
      - qcut/scripts/test_body_coreml_editor_report.py
      - .github/workflows/body-execution-contracts.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: body-execution-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: qcut

jobs:
  contracts:
    name: Body contracts (${{ matrix.runner }})
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
      - name: Install public test dependencies
        run: >-
          python -m pip install --only-binary=:all:
          numpy==2.5.3 Pillow==12.2.0 onnxruntime==1.22.1 onnx==1.19.0
      - name: Test portable resident protocol, source identity and execution journal
        working-directory: qcut/research/independent-beauty/research/tests
        run: >-
          python -B -m unittest
          test_body_coreml_assets test_body_coreml_process
          test_body_coreml_capability test_body_coreml_capability_worker
          test_body_execution_profile test_body_execution_sources test_body_execution_journal -v
      - name: Test macOS routing, cadence and complete session recovery without private assets
        if: runner.os == 'macOS'
        working-directory: qcut/research/independent-beauty/research/tests
        run: >-
          python -B -m unittest
          test_body_smart_sequence test_body_sequence_checkpoint
          test_body_swing_cadence test_body_swing_networks test_body_swing_skeleton test_body_swing_render
          test_body_execution_checkpoint test_body_execution_sessions test_independent_worker -v
      - name: Test native evidence gates with synthetic fixtures
        run: >-
          python -B -m unittest discover -s research/jianying-runtime-probe
          -p 'test_body_backend_*.py' -v
      - name: Test original-pixel probe boundaries with synthetic fixtures
        run: >-
          python -B -m unittest discover -s research/independent-beauty/probes
          -p 'test_body_swing_render_probe.py' -v
      - name: Test native timestamp evidence contracts with synthetic fixtures
        run: >-
          python -B -m unittest discover -s research/jianying-runtime-probe
          -p 'test_body_timestamp_*.py' -v
      - name: Test editor evidence reports with synthetic fixtures
        run: python -B -m unittest discover -s scripts -p 'test_body_coreml_editor_report.py' -v
